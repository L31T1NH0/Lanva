name: Android APK
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        id: java17
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-java@v4
        id: java25
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Android tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - name: Check process lifecycle and source adaptations
        run: ./scripts/test.sh
      - name: Build Fabric runtime and APK
        env:
          JAVA_HOME: ${{ steps.java17.outputs.path }}
          FABRIC_BUILD_JAVA_HOME: ${{ steps.java25.outputs.path }}
        run: |
          python3 scripts/build-fabric.py
          python3 tests/check-fabric-runtime.py
          ./gradlew --no-daemon assembleDebug assembleRelease lintRelease
      - uses: actions/upload-artifact@v4
        with:
          name: lanva
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

