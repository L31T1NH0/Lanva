plugins { id 'com.android.application' }

android {
    namespace 'io.oxide.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'io.oxide.mobile'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.3.2-fabric'
        // shortcut: ARM64 only for the first device test; add ABIs after validating this build.
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Android extracts this packaged PIE executable to the read-only native library directory.
    packaging { jniLibs { useLegacyPackaging = true; keepDebugSymbols += '**/*.so' } }
}

tasks.register('checkServerRuntime') {
    doLast {
        if (!file('src/main/jniLibs/arm64-v8a/libfabric_launcher.so').isFile()
            || !file('src/main/assets/fabric-bootstrap.jar').isFile()
            || [17, 21, 25].any { !file("src/main/assets/java${it}.zip").isFile() }) {
            throw new GradleException('Runtime ausente. Execute python3 scripts/build-fabric.py antes de montar o APK.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'checkServerRuntime' }

